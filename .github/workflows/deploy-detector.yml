name: Deploy minute detector to Cloudflare

on:
  workflow_dispatch:
    inputs:
      free_usage_verified:
        description: "I verified Workers Free and zero paid overage/top-up controls for GitHub and Apify"
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: deploy-tiktok-detector
  cancel-in-progress: false

jobs:
  deploy:
    if: inputs.free_usage_verified
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate required credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SCHEDULER_GITHUB_TOKEN: ${{ secrets.SCHEDULER_GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import os
          missing = [key for key in ("CLOUDFLARE_API_TOKEN", "SCHEDULER_GITHUB_TOKEN") if not os.getenv(key)]
          if missing:
              raise SystemExit("Missing repository secrets: " + ", ".join(missing))
          PY
      - name: Test detector and multi-account handling
        run: |
          node --test scheduler/worker.test.mjs
          python -m unittest test_sources -q
      - name: Deploy cron-only minute detector
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: scheduler
          command: deploy --var TIKTOK_USERNAMES:${{ secrets.TIKTOK_USERNAMES }} --var PRIMARY_USERNAME:${{ secrets.TIKTOK_USERNAME }} --var TARGET_PLATFORMS:youtube,instagram
          secrets: |
            GITHUB_TOKEN
        env:
          GITHUB_TOKEN: ${{ secrets.SCHEDULER_GITHUB_TOKEN }}
      - name: Activation follow-up
        run: |
          echo "Detector deployed. Verify Cloudflare scheduled events, discovery and real publication latency."
          echo "Existing GitHub schedule intentionally remains enabled until the live test succeeds."
