name: TikTok repost agent

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
    inputs:
      probe:
        description: "Test only: download the newest video, publish nothing"
        type: boolean
        default: false

concurrency:
  group: agent
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # Posting history lives in a private repo; the deploy key is the only link between the two.
      - name: Load posting history from the private data repo
        uses: actions/checkout@v4
        with:
          repository: ahmedmatwe/tiktok-agent-data
          ssh-key: ${{ secrets.DATA_DEPLOY_KEY }}
          path: private-data
      - run: mkdir -p data && cp private-data/state.json data/state.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          pip install -r requirements.txt
          pip install -U yt-dlp
          command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)

      - name: Check TikTok and repost new videos
        env:
          TIKTOK_USERNAME: ${{ secrets.TIKTOK_USERNAME }}
          TIKTOK_USERNAMES: ${{ secrets.TIKTOK_USERNAMES }}
          TIKTOK_SEC_UID: ${{ secrets.TIKTOK_SEC_UID }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          BACKFILL: "false"
          LLM_PROVIDER: gemini
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
          CAPTION_LANGUAGE: ${{ secrets.CAPTION_LANGUAGE }}
          ENABLE_YOUTUBE: ${{ secrets.ENABLE_YOUTUBE }}
          ENABLE_INSTAGRAM: ${{ secrets.ENABLE_INSTAGRAM }}
          YOUTUBE_PRIVACY: ${{ secrets.YOUTUBE_PRIVACY }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          META_GRAPH_VERSION: ${{ secrets.META_GRAPH_VERSION }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
        run: python -u agent.py ${{ inputs.probe && '--probe' || '--once' }}

      - name: Save progress to the private data repo
        if: always()
        working-directory: private-data
        run: |
          cp ../data/state.json state.json
          git config user.name "tiktok-agent"
          git config user.email "tiktok-agent@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || (git commit -m "Update agent state" && git push)
